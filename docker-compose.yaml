services:
  db:
    image: postgres:18.3-alpine3.23
    container_name: habbit_tracker_db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-squares}
    ports:
      - 127.0.0.1:5499:5432
    volumes:
      - habbit_tracker:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-squares}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  db-test:
    image: postgres:18.3-alpine3.23
    container_name: habbit_tracker_db_test
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=squares
    ports:
      - 127.0.0.1:5501:5432
    volumes:
      - habbit_tracker_test:/var/lib/postgresql
  api:
    build:
      context: ./backend
    container_name: habbit_tracker_api
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-squares}
      - COOKIE_NAME=${COOKIE_NAME:-tiny-wins}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - FRONTEND_URL=https://${DOMAIN:-tinywins.frasier.dev}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN:-tinywins.frasier.dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8800:8800
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: /api
        NEXT_PUBLIC_COOKIE_NAME: ${COOKIE_NAME:-tiny-wins}
    container_name: habbit_tracker_web
    environment:
      - BACKEND_URL=http://api:8800
      - NEXT_PUBLIC_COOKIE_NAME=${COOKIE_NAME:-tiny-wins}
    depends_on:
      - api
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    container_name: habbit_tracker_caddy
    environment:
      - DOMAIN=${DOMAIN:-tinywins.frasier.dev}
      - ACME_EMAIL=${ACME_EMAIL:-admin@${DOMAIN:-tinywins.frasier.dev}}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  habbit_tracker:
    driver: local
  habbit_tracker_test:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
